version: '3.8'

services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  bot_worker:
    build: .
    restart: always
    env_file: .env
    environment:
      - RUN_MODE=BOT
      - REDIS_URL=redis://redis:6379
    command: python -m WebStreamer
    depends_on:
      - redis
    volumes:
      - ./streambot.log:/app/streambot.log

  web_worker:
    build: .
    restart: always
    env_file: .env
    environment:
      - RUN_MODE=WEB
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - BIND_ADDRESS=0.0.0.0
    command: gunicorn WebStreamer.server:web_server --bind 0.0.0.0:8080 --worker-class aiohttp.GunicornWebWorker --workers 4
    depends_on:
      - redis
    volumes:
      - ./streambot.log:/app/streambot.log

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_worker
