<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>%s</title> <!-- 1st: heading -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .plyr { border-radius: 0.5rem; overflow: hidden; }
        .dropdown-content { display: none; }
        .dropdown:focus-within .dropdown-content { display: flex; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-3xl bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden p-6 relative">
        <div class="mb-6 border-b border-zinc-800 pb-4 flex items-center gap-3">
            <i data-lucide="video" class="text-zinc-400"></i>
            <h1 class="text-xl font-semibold break-all text-zinc-100">%s</h1> <!-- 2nd: file_name -->
        </div>

        <div class="bg-black rounded-xl overflow-hidden mb-6 shadow-md border border-zinc-900">
            <video class="plyr" controls crossorigin playsinline>
                <source src="%s" type="tag/mp4"> <!-- 3rd: src -->
            </video>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <button onclick="download()" class="flex-1 bg-zinc-100 text-zinc-900 hover:bg-zinc-200 transition-colors font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2">
                <i data-lucide="download" class="w-5 h-5"></i> Download
            </button>
            <button onclick="copyLink()" class="flex-1 bg-zinc-800 text-zinc-100 hover:bg-zinc-700 transition-colors font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 border border-zinc-700">
                <i data-lucide="link" class="w-5 h-5"></i> Copy Link
            </button>
            <div class="dropdown relative group flex-1">
                <button class="w-full bg-zinc-800 text-zinc-100 hover:bg-zinc-700 transition-colors font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 border border-zinc-700">
                    <i data-lucide="external-link" class="w-5 h-5"></i> Stream Ext...
                </button>
                <div class="dropdown-content absolute bottom-full left-0 w-full mb-2 bg-zinc-800 border border-zinc-700 rounded-lg shadow-xl flex-col overflow-hidden z-10 transition-opacity">
                    <a href="#" onclick="playOnline('vlc')" class="px-4 py-2.5 hover:bg-zinc-700 flex items-center gap-2 text-sm text-zinc-200 hover:text-white outline-none">
                        <i data-lucide="monitor-play" class="w-4 h-4"></i> VLC Player
                    </a>
                    <a href="#" onclick="playOnline('mx')" class="px-4 py-2.5 hover:bg-zinc-700 flex items-center gap-2 text-sm text-zinc-200 hover:text-white outline-none">
                        <i data-lucide="smartphone" class="w-4 h-4"></i> MX Player
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-zinc-800 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300">
        <i data-lucide="check-circle" class="text-emerald-500 w-5 h-5"></i>
        <span class="text-sm font-medium">Link copied to clipboard</span>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            new Plyr('.plyr', { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
        });

        const finalUrl = window.location.href.replace("/watch/", "/dl/");

        function playOnline(player) {
            const urls = {
                vlc: `vlc://${finalUrl}`,
                mx: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.ad;end`
            };
            window.location.href = urls[player] || finalUrl;
        }

        function download() { window.location.href = finalUrl; }

        function copyLink() {
            navigator.clipboard.writeText(finalUrl).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
            });
        }
    </script>
</body>
</html>
